<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .permission-modal {
            padding: 10px 0;
        }
        .permission-modal .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a3a5c;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f2f5;
        }
        .permission-modal .section-title i {
            margin-right: 6px;
        }

        .permission-list {
            margin-bottom: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .permission-list .perm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #f7f9fc;
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 3px solid #52c41a;
        }
        .permission-list .perm-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .permission-list .perm-item .info .store-name {
            font-weight: 500;
            color: #333;
        }
        .permission-list .perm-item .info .store-code {
            color: #999;
            font-size: 12px;
        }
        .permission-list .perm-item .btn-remove-perm {
            background: none;
            border: none;
            color: #ff4d4f;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .permission-list .perm-item .btn-remove-perm:hover {
            background: #ffeded;
        }
        .permission-list .empty-text {
            text-align: center;
            color: #bbb;
            padding: 20px 0;
            font-size: 13px;
        }

        .add-permission-area {
            padding-top: 12px;
            border-top: 1px solid #f0f2f5;
        }
        .add-permission-area .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            max-height: 150px;
            overflow-y: auto;
            padding: 6px 0;
            margin-bottom: 10px;
        }
        .add-permission-area .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .add-permission-area .checkbox-grid label:hover {
            background: #f0f4f9;
        }
        .add-permission-area .checkbox-grid input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2d6a9f;
            flex-shrink: 0;
        }
        .add-permission-area .checkbox-grid .store-code-label {
            color: #999;
            font-size: 11px;
        }
        .add-permission-area .checkbox-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .add-permission-area .checkbox-actions button {
            padding: 3px 12px;
            border: 1px solid #e0e4ea;
            border-radius: 4px;
            background: #fafbfc;
            font-size: 12px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        .add-permission-area .checkbox-actions button:hover {
            background: #f0f2f5;
        }
        .add-permission-area .btn-add-perm {
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #2d6a9f, #1a3a5c);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .add-permission-area .btn-add-perm:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(45,106,159,0.3);
        }
        .add-permission-area .no-stores-msg {
            text-align: center;
            color: #52c41a;
            padding: 10px 0;
            font-size: 13px;
        }

        .btn-sm.btn-permission {
            background: #f0f0f0;
            color: #666;
        }
        .btn-sm.btn-permission:hover {
            background: #e0e0e0;
        }

        .admin-hint {
            text-align: center;
            color: #52c41a;
            padding: 20px 0;
            font-size: 14px;
        }
        .admin-hint i {
            margin-right: 6px;
        }

        @media (max-width: 480px) {
            .add-permission-area .checkbox-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="tableWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/table.js"></script>
    <script>
        var userTable = new DataTable({
            container: '#tableWrap',
            title: '用户管理',
            subtitle: '管理系统用户及门店权限',
            icon: '👤',
            badge: '共 0 人',

            api: UserAPI,

            // 开启导入导出
            importable: true,
            exportable: true,

            searchFields: [
                { value: 'username', label: '用户名' },
                { value: 'fullname', label: '姓名' },
                { value: 'email', label: '邮箱' },
                { value: 'phone', label: '电话' }
            ],

            advancedFields: [
                { value: 'username', label: '用户名' },
                { value: 'fullname', label: '姓名' },
                { value: 'email', label: '邮箱' },
                { value: 'phone', label: '电话' },
                { value: 'role', label: '角色' },
                { value: 'status', label: '状态' }
            ],

            stats: [
                { id: 'statTotal', label: '用户总数', icon: '👤', calc: function(row) { return 1; } },
                { id: 'statActive', label: '已启用', icon: '✅', color: 'green', calc: function(row) { return row.Status === 1 ? 1 : 0; } },
                { id: 'statInactive', label: '已停用', icon: '⛔', color: 'red', calc: function(row) { return row.Status === 0 ? 1 : 0; } },
                { id: 'statAdmin', label: '系统管理员', icon: '👑', color: 'purple', calc: function(row) { return row.UserRole === 2 ? 1 : 0; } }
            ],

            columns: [
                { field: 'UserName', label: '用户名', width: '120px' },
                { field: 'FullName', label: '姓名', width: '100px' },
                { field: 'Email', label: '邮箱', width: '160px' },
                { field: 'Phone', label: '电话', width: '120px' },
                {
                    field: 'UserRole',
                    label: '角色',
                    width: '100px',
                    render: function(value) {
                        var text = value === 2 ? '系统管理员' : '普通用户';
                        var cls = value === 2 ? 'tag-orange' : 'tag-blue';
                        return '<span class="tag ' + cls + '"><span class="dot"></span>' + text + '</span>';
                    }
                },
                {
                    field: 'Status',
                    label: '状态',
                    width: '80px',
                    render: function(value) {
                        var text = value === 1 ? '启用' : '停用';
                        var cls = value === 1 ? 'tag-green' : 'tag-red';
                        return '<span class="tag ' + cls + '"><span class="dot"></span>' + text + '</span>';
                    }
                },
                { field: 'CreateDate', label: '创建时间', width: '150px' }
            ],

            rowActions: [
                { label: '编辑', class: 'btn-edit', icon: 'fas fa-edit', handler: 'showEdit' },
                {
                    label: '权限',
                    class: 'btn-permission',
                    icon: 'fas fa-key',
                    handler: 'showPermission',
                    disabled: function(row) {
                        return row.UserRole === 2;
                    }
                },
                { label: '删除', class: 'btn-delete', icon: 'fas fa-trash', handler: 'showDelete' }
            ],

            formFields: [
                { id: 'fUsername', field: 'username', label: '用户名', type: 'text', required: true, placeholder: '请输入用户名' },
                { id: 'fFullname', field: 'fullname', label: '姓名', type: 'text', required: true, placeholder: '请输入姓名' },
                { id: 'fEmail', field: 'email', label: '邮箱', type: 'email', placeholder: '请输入邮箱' },
                { id: 'fPhone', field: 'phone', label: '电话', type: 'text', placeholder: '请输入电话' },
                {
                    id: 'fRole',
                    field: 'user_role',
                    label: '角色',
                    type: 'select',
                    required: true,
                    options: [
                        { value: 1, label: '普通用户' },
                        { value: 2, label: '系统管理员' }
                    ]
                },
                {
                    id: 'fStatus',
                    field: 'status',
                    label: '状态',
                    type: 'select',
                    required: true,
                    options: [
                        { value: 1, label: '启用' },
                        { value: 0, label: '停用' }
                    ]
                },
                { id: 'fPassword', field: 'password', label: '密码', type: 'password', placeholder: '留空则不修改', hint: '默认密码: 123456' },
                { id: 'fRemarks', field: 'remarks', label: '备注', type: 'textarea', placeholder: '请输入备注信息' }
            ]
        });

        // ============================================================
        //  权限管理功能
        // ============================================================

        var currentUserId = null;
        var currentUserName = '';
        var allStores = [];
        var userPermissions = [];
        var currentUserRole = 0;

        function showPermission(userId) {
            currentUserId = userId;

            UserAPI.get(userId).then(function(userData) {
                currentUserName = userData.FullName || userData.UserName;
                currentUserRole = userData.UserRole || 1;

                if (currentUserRole === 2) {
                    var html = '<div class="permission-modal">';
                    html += '<div class="section-title"><i class="fas fa-key"></i> ' + currentUserName + ' 的门店权限</div>';
                    html += '<div class="admin-hint"><i class="fas fa-check-circle"></i> 系统管理员拥有所有门店的完全控制权限，无需单独授权</div>';
                    html += '</div>';
                    openPermissionModal(html);
                    return;
                }

                return StoreAPI.list({});
            }).then(function(stores) {
                if (currentUserRole === 2) return;
                allStores = stores || [];
                return PermissionAPI.list({ user_id: currentUserId });
            }).then(function(permissions) {
                if (currentUserRole === 2) return;
                userPermissions = permissions || [];
                var html = buildPermissionModalHtml();
                openPermissionModal(html);
            }).catch(function(err) {
                if (userTable.layer) {
                    userTable.layer.msg('加载数据失败: ' + err, {icon: 5});
                }
            });
        }

        function buildPermissionModalHtml() {
            var authorizedIds = userPermissions.map(function(p) { return p.StoreId; });
            var availableStores = allStores.filter(function(s) {
                return authorizedIds.indexOf(s.Id) === -1;
            });

            var html = '<div class="permission-modal">';
            html += '<div class="section-title"><i class="fas fa-key"></i> ' + currentUserName + ' 的门店权限</div>';

            html += '<div class="permission-list" id="permList">';
            if (userPermissions.length === 0) {
                html += '<div class="empty-text">暂无门店权限，请添加</div>';
            } else {
                userPermissions.forEach(function(p) {
                    html += `
                        <div class="perm-item" data-perm-id="${p.Id}">
                            <div class="info">
                                <span class="store-name">${p.StoreName || '未知门店'}</span>
                                <span class="store-code">${p.StoreCode || ''}</span>
                            </div>
                            <button class="btn-remove-perm" onclick="removePermission(${p.Id})" title="移除权限">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                });
            }
            html += '</div>';

            html += '<div class="add-permission-area">';
            if (availableStores.length === 0) {
                html += '<div class="no-stores-msg"><i class="fas fa-check-circle"></i> 所有门店已授权</div>';
            } else {
                html += '<div class="checkbox-actions">';
                html += '<button onclick="selectAllStores(true)">全选</button>';
                html += '<button onclick="selectAllStores(false)">取消全选</button>';
                html += '</div>';
                html += '<div class="checkbox-grid" id="storeCheckboxGrid">';
                availableStores.forEach(function(s) {
                    html += `
                        <label>
                            <input type="checkbox" class="store-checkbox" value="${s.Id}">
                            <span>${s.StoreName}</span>
                            <span class="store-code-label">(${s.StoreCode})</span>
                        </label>
                    `;
                });
                html += '</div>';
                html += '<button class="btn-add-perm" onclick="addPermissions()">';
                html += '<i class="fas fa-plus"></i> 添加选中门店权限（完全控制）';
                html += '</button>';
            }
            html += '</div>';
            html += '</div>';
            return html;
        }

        function selectAllStores(selectAll) {
            var checkboxes = document.querySelectorAll('.store-checkbox');
            for (var i = 0; i < checkboxes.length; i++) {
                checkboxes[i].checked = selectAll;
            }
        }

        function openPermissionModal(html) {
            if (!userTable.layer) {
                alert('LayUI 未加载');
                return;
            }
            if (userTable.permModalIndex) {
                userTable.layer.close(userTable.permModalIndex);
            }
            userTable.permModalIndex = userTable.layer.open({
                type: 1,
                title: '<i class="fas fa-key" style="color:#2d6a9f;"></i> 门店权限管理',
                area: ['520px', 'auto'],
                content: html,
                shadeClose: true,
                resize: false,
                maxHeight: '90vh'
            });
        }

        function refreshPermissionList() {
            PermissionAPI.list({ user_id: currentUserId }).then(function(permissions) {
                userPermissions = permissions || [];
                var html = buildPermissionModalHtml();
                var content = document.querySelector('.layui-layer-content');
                if (content) {
                    content.innerHTML = html;
                }
            }).catch(function(err) {
                if (userTable.layer) {
                    userTable.layer.msg('刷新失败: ' + err, {icon: 5});
                }
            });
        }

        function addPermissions() {
            var checkboxes = document.querySelectorAll('.store-checkbox:checked');
            if (checkboxes.length === 0) {
                if (userTable.layer) userTable.layer.msg('请至少选择一个门店', {icon: 5});
                return;
            }
            if (!userTable.layer) return;
            userTable.layer.load(1);

            var promises = [];
            for (var i = 0; i < checkboxes.length; i++) {
                var storeId = parseInt(checkboxes[i].value);
                promises.push(
                    PermissionAPI.add({
                        user_id: currentUserId,
                        store_id: storeId,
                        permission_level: 3
                    })
                );
            }

            Promise.all(promises).then(function() {
                userTable.layer.closeAll('loading');
                if (userTable.layer) userTable.layer.msg('添加成功，共 ' + promises.length + ' 个门店', {icon: 1});
                refreshPermissionList();
                userTable.loadData();
            }).catch(function(err) {
                userTable.layer.closeAll('loading');
                if (userTable.layer) userTable.layer.msg('添加失败: ' + err, {icon: 5});
            });
        }

        function removePermission(permId) {
            if (!userTable.layer) return;

            userTable.layer.confirm(
                '<div class="confirm-danger" style="padding:10px 0;">' +
                '<div class="icon" style="font-size:36px;">⚠️</div>' +
                '<div class="title" style="font-size:15px;">确定要移除该门店权限吗？</div>' +
                '<div class="desc" style="font-size:13px;">移除后该用户将无法访问此门店数据</div>' +
                '</div>',
                { icon: 0, title: '确认移除' },
                function(index) {
                    userTable.layer.load(1);
                    PermissionAPI.delete(permId).then(function() {
                        userTable.layer.closeAll('loading');
                        if (userTable.layer) userTable.layer.msg('移除成功', {icon: 1});
                        refreshPermissionList();
                        userTable.loadData();
                        userTable.layer.close(index);
                    }).catch(function(err) {
                        userTable.layer.closeAll('loading');
                        if (userTable.layer) userTable.layer.msg('移除失败: ' + err, {icon: 5});
                    });
                }
            );
        }

        userTable.showPermission = function(userId) {
            showPermission(userId);
        };

        StoreAPI.list({}).then(function(stores) {
            allStores = stores || [];
        }).catch(function(err) {
            console.error('预加载门店失败:', err);
        });
    </script>
</body>
</html>
