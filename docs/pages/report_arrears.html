<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>欠款汇总</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="tableWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/table.js"></script>
    <script>
        var reportArrearsTable = new DataTable({
            container: '#tableWrap',
            title: '欠款汇总',
            subtitle: '所有欠款商户汇总',
            icon: '📉',
            badge: '共 0 家',

            api: ReportAPI,

            importable: false,
            exportable: true,

            searchFields: [
                { value: 'store_name', label: '门店名称' },
                { value: 'counter_name', label: '专柜名称' },
                { value: 'tenant_name', label: '承租人' }
            ],

            advancedFields: [
                { value: 'store_name', label: '门店名称' },
                { value: 'counter_name', label: '专柜名称' },
                { value: 'tenant_name', label: '承租人' }
            ],

            stats: [
                { id: 'statTotal', label: '欠款商户', icon: '🏪', calc: function(row) { return 1; } },
                { id: 'statArrears', label: '欠款总额', icon: '💰', color: 'red', calc: function(row) { return parseFloat(row.TotalArrears) || 0; } },
                { id: 'statRent', label: '欠租金', icon: '📄', color: 'orange', calc: function(row) { return parseFloat(row.ArrearsRent) || 0; } },
                { id: 'statUtility', label: '欠水电费', icon: '💧', color: 'blue', calc: function(row) { return (parseFloat(row.ArrearsWater) || 0) + (parseFloat(row.ArrearsElectric) || 0); } }
            ],

            columns: [
                { field: 'StoreName', label: '门店名称', width: '130px' },
                { field: 'CounterCode', label: '专柜编号', width: '100px' },
                { field: 'CounterName', label: '专柜名称', width: '140px' },
                { field: 'TenantName', label: '承租人', width: '80px' },
                { 
                    field: 'ArrearsMonths', 
                    label: '欠款月数', 
                    width: '90px',
                    render: function(value) {
                        var cls = value >= 3 ? 'tag-red' : (value >= 2 ? 'tag-orange' : 'tag-green');
                        return '<span class="tag ' + cls + '"><span class="dot"></span>' + (value || 0) + '个月</span>';
                    }
                },
                { 
                    field: 'ArrearsRent', 
                    label: '欠租金', 
                    width: '110px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="money money-negative">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'ArrearsWater', 
                    label: '欠水费', 
                    width: '100px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="money" style="color:#2d6a9f;">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'ArrearsElectric', 
                    label: '欠电费', 
                    width: '100px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="money" style="color:#faad14;">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'TotalArrears', 
                    label: '欠款合计', 
                    width: '120px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="money" style="font-weight:700;color:#ff4d4f;">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'OverdueMonths', 
                    label: '逾期月数', 
                    width: '90px',
                    render: function(value) {
                        var v = value || 0;
                        if (v === 0) return '<span class="tag tag-green"><span class="dot"></span>正常</span>';
                        return '<span class="tag tag-red"><span class="dot"></span>' + v + '个月</span>';
                    }
                }
            ],

            rowActions: [],
            formFields: []
        });

        // ============================================================
        //  重写 loadData（使用 ReportAPI.arrearsSummary）
        // ============================================================
        var originalLoadData2 = reportArrearsTable.loadData;
        reportArrearsTable.loadData = function() {
            var params = {};
            var tab = document.querySelector('.search-tabs .tab.active');
            var tabName = tab ? tab.dataset.tab : 'quick';

            if (tabName === 'quick') {
                var field = document.getElementById('quickField');
                var value = document.getElementById('quickValue');
                if (field && value && value.value.trim()) {
                    params[field.value] = value.value.trim();
                }
            } else {
                var conditions = reportArrearsTable.buildConditions();
                if (conditions.length > 0) {
                    params.conditions = conditions;
                    var logic = document.getElementById('logicType');
                    if (logic) params.logic = logic.value;
                }
            }

            var user = getCurrentUser();
            if (user && user.Id) {
                params._user_id = user.Id;
            }

            ReportAPI.arrearsSummary(params).then(function(data) {
                reportArrearsTable.allData = data || [];
                reportArrearsTable.filteredData = reportArrearsTable.allData.slice();
                reportArrearsTable.totalPages = Math.ceil(reportArrearsTable.filteredData.length / reportArrearsTable.pageSize) || 1;
                if (reportArrearsTable.currentPage > reportArrearsTable.totalPages) reportArrearsTable.currentPage = reportArrearsTable.totalPages || 1;
                reportArrearsTable.renderStats();
                reportArrearsTable.renderTable();
                reportArrearsTable.renderPagination();
                reportArrearsTable.updateSearchIndicator();
                if (reportArrearsTable.config.onLoad && typeof reportArrearsTable.config.onLoad === 'function') {
                    reportArrearsTable.config.onLoad(reportArrearsTable.allData);
                }
            }).catch(function(err) {
                if (reportArrearsTable.layer) reportArrearsTable.layer.msg('加载失败: ' + err, {icon: 5});
                reportArrearsTable.allData = [];
                reportArrearsTable.filteredData = [];
                reportArrearsTable.renderStats();
                reportArrearsTable.renderTable();
                reportArrearsTable.renderPagination();
            });
        };
    </script>
</body>
</html>
