<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>收款管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .payment-method-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .payment-method-tag.cash { background: #e6f7e6; color: #52c41a; }
        .payment-method-tag.bank { background: #e8f0fe; color: #2d6a9f; }
        .payment-method-tag.check { background: #fff7e6; color: #faad14; }
        .payment-method-tag.wechat { background: #e6f7e6; color: #52c41a; }
        .payment-method-tag.alipay { background: #e8f0fe; color: #2d6a9f; }

        /* ===== 收款单打印样式 ===== */
        .receipt-print-wrap {
            display: none;
        }
        .receipt-print-wrap .receipt-box {
            width: 210mm;
            padding: 15mm 20mm;
            background: #fff;
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
        }
        .receipt-print-wrap .receipt-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 8px;
            padding-bottom: 6px;
            border-bottom: 3px double #333;
            margin-bottom: 12px;
        }
        .receipt-print-wrap .receipt-sub {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 14px;
        }
        .receipt-print-wrap .receipt-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
        }
        .receipt-print-wrap .receipt-info .left span,
        .receipt-print-wrap .receipt-info .right span {
            display: inline-block;
            min-width: 80px;
            color: #666;
        }
        .receipt-print-wrap .receipt-info .left .val,
        .receipt-print-wrap .receipt-info .right .val {
            color: #333;
            font-weight: 500;
        }
        .receipt-print-wrap .receipt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 10px 0;
        }
        .receipt-print-wrap .receipt-table th {
            background: #f5f5f5;
            padding: 6px 8px;
            border: 1px solid #ddd;
            text-align: center;
            font-weight: 600;
        }
        .receipt-print-wrap .receipt-table td {
            padding: 6px 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .receipt-print-wrap .receipt-table .text-left {
            text-align: left;
        }
        .receipt-print-wrap .receipt-total {
            text-align: right;
            font-size: 16px;
            padding: 8px 0;
            border-top: 2px solid #333;
            margin-top: 4px;
        }
        .receipt-print-wrap .receipt-total .amount {
            font-size: 20px;
            font-weight: 700;
            color: #d32f2f;
        }
        .receipt-print-wrap .receipt-footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        .receipt-print-wrap .receipt-footer .sign {
            min-width: 120px;
            text-align: center;
        }
        .receipt-print-wrap .receipt-footer .sign .line {
            display: inline-block;
            width: 100px;
            border-bottom: 1px solid #333;
            margin-top: 4px;
        }
        .receipt-print-wrap .receipt-remark {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }

        /* 打印时显示 */
        @media print {
            .receipt-print-wrap {
                display: block !important;
            }
            .receipt-print-wrap .receipt-box {
                padding: 10mm 15mm;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="tableWrap"></div>

    <!-- ===== 收款单打印模板（隐藏） ===== -->
    <div class="receipt-print-wrap" id="receiptPrintWrap">
        <div class="receipt-box" id="receiptContent">
            <div class="receipt-title">收 款 凭 证</div>
            <div class="receipt-sub">RENT RECEIPT</div>

            <div class="receipt-info">
                <div class="left">
                    <span>收款单号：</span><span class="val" id="printNo">-</span>
                </div>
                <div class="right">
                    <span>收款日期：</span><span class="val" id="printDate">-</span>
                </div>
            </div>
            <div class="receipt-info" style="border-bottom:1px solid #ddd;padding-bottom:8px;">
                <div class="left">
                    <span>合同编号：</span><span class="val" id="printContract">-</span>
                </div>
                <div class="right">
                    <span>专柜名称：</span><span class="val" id="printCounter">-</span>
                </div>
            </div>

            <table class="receipt-table">
                <thead>
                    <tr>
                        <th style="width:60px;">序号</th>
                        <th style="width:100px;">费用项目</th>
                        <th style="width:100px;">金额（元）</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody id="printItems">
                    <tr><td>1</td><td>租金</td><td id="printRent">0.00</td><td></td></tr>
                    <tr><td>2</td><td>水费</td><td id="printWater">0.00</td><td></td></tr>
                    <tr><td>3</td><td>电费</td><td id="printElectric">0.00</td><td></td></tr>
                    <tr><td>4</td><td>其他费用</td><td id="printOther">0.00</td><td></td></tr>
                </tbody>
            </table>

            <div class="receipt-total">
                合计（大写）：<span id="printTotalCN">零元整</span>
                &nbsp;&nbsp;&nbsp;&nbsp;
                合计（小写）：<span class="amount" id="printTotal">¥0.00</span>
            </div>

            <div class="receipt-footer">
                <div class="sign">
                    <div>收款人</div>
                    <div class="line" id="printReceiver"></div>
                </div>
                <div class="sign">
                    <div>复核人</div>
                    <div class="line"></div>
                </div>
                <div class="sign">
                    <div>客户签收</div>
                    <div class="line"></div>
                </div>
                <div style="text-align:right;font-size:12px;color:#999;">
                    打印时间：<span id="printTime">-</span>
                </div>
            </div>

            <div class="receipt-remark" id="printRemark"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/table.js"></script>
    <script>
        var paymentTable = new DataTable({
            container: '#tableWrap',
            title: '收款管理',
            subtitle: '查看所有收款记录',
            icon: '💳',
            badge: '共 0 笔',

            api: PaymentAPI,

            importable: false,
            exportable: true,

            searchFields: [
                { value: 'payment_no', label: '收款单号' },
                { value: 'counter_name', label: '专柜名称' }
            ],

            advancedFields: [
                { value: 'payment_no', label: '收款单号' },
                { value: 'counter_name', label: '专柜名称' },
                { value: 'payment_method', label: '收款方式' },
                { value: 'payment_date', label: '收款日期' }
            ],

            stats: [
                { id: 'statTotal', label: '收款总笔数', icon: '📋', calc: function(row) { return 1; } },
                { id: 'statAmount', label: '收款总金额', icon: '💰', color: 'green', calc: function(row) { return parseFloat(row.PaymentAmount) || 0; } },
                { id: 'statToday', label: '今日收款', icon: '📅', color: 'blue', calc: function(row) {
                    var today = new Date().toISOString().split('T')[0];
                    return row.PaymentDate === today ? (parseFloat(row.PaymentAmount) || 0) : 0;
                } }
            ],

            columns: [
                { field: 'PaymentNo', label: '收款单号', width: '130px' },
                { field: 'PaymentDate', label: '收款日期', width: '110px' },
                { field: 'StoreName', label: '所属门店', width: '110px' },
                { field: 'CounterCode', label: '专柜编号', width: '100px' },
                { field: 'CounterName', label: '专柜名称', width: '120px' },
                { field: 'ContractNo', label: '合同编号', width: '120px' },
                { field: 'TenantName', label: '承租人', width: '80px' },
                { 
                    field: 'PaymentAmount', 
                    label: '收款金额', 
                    width: '110px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="money money-positive">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'PaymentMethod', 
                    label: '收款方式', 
                    width: '90px',
                    render: function(value) {
                        var map = {
                            1: { text: '现金', cls: 'cash' },
                            2: { text: '银行转账', cls: 'bank' },
                            3: { text: '支票', cls: 'check' },
                            4: { text: '微信', cls: 'wechat' },
                            5: { text: '支付宝', cls: 'alipay' }
                        };
                        var info = map[value] || { text: '未知', cls: 'cash' };
                        return '<span class="payment-method-tag ' + info.cls + '"><i class="fas fa-circle" style="font-size:6px;"></i> ' + info.text + '</span>';
                    }
                },
                { 
                    field: 'VerifyStatus', 
                    label: '状态', 
                    width: '80px',
                    render: function(value) {
                        return value === 1 ? '<span class="tag tag-green"><span class="dot"></span>已核销</span>' : 
                               '<span class="tag tag-gray"><span class="dot"></span>待核销</span>';
                    }
                },
                { field: 'ReceiptNo', label: '收据号', width: '100px' },
                { field: 'CreateDate', label: '创建时间', width: '155px' }
            ],

            // 添加"打印"操作按钮
            rowActions: [
                { 
                    label: '打印', 
                    class: 'btn-permission', 
                    icon: 'fas fa-print', 
                    handler: 'printReceipt'
                }
            ],

            formFields: []
        });

        // ============================================================
        //  打印收款单功能
        // ============================================================
        function printReceipt(paymentId) {
            if (!paymentTable.layer) {
                alert('LayUI 未加载');
                return;
            }

            paymentTable.layer.load(1);
            PaymentAPI.get(paymentId).then(function(data) {
                paymentTable.layer.closeAll('loading');
                if (!data) {
                    paymentTable.layer.msg('数据不存在', {icon: 5});
                    return;
                }

                // 获取关联的应收账款详情
                return Promise.all([data, ReceivableAPI.get(data.ReceivableDetailId)]);
            }).then(function(results) {
                var payment = results[0];
                var receivable = results[1] || {};

                // 填充打印数据
                fillReceiptData(payment, receivable);

                // 打开打印窗口
                var printWindow = window.open('', '_blank', 'width=800,height=600,scrollbars=yes');
                if (!printWindow) {
                    paymentTable.layer.msg('请允许弹出窗口', {icon: 5});
                    return;
                }

                var printContent = document.getElementById('receiptPrintWrap').cloneNode(true);
                printContent.style.display = 'block';

                var html = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>收款单 - ${payment.PaymentNo}</title>
                        <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; }
                            body { background: #f0f0f0; padding: 20px; }
                            .receipt-box {
                                width: 210mm;
                                margin: 0 auto;
                                padding: 15mm 20mm;
                                background: #fff;
                                font-family: "Microsoft YaHei", "SimSun", sans-serif;
                                box-shadow: 0 2px 12px rgba(0,0,0,0.1);
                            }
                            .receipt-title { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 8px; padding-bottom: 6px; border-bottom: 3px double #333; margin-bottom: 12px; }
                            .receipt-sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 14px; }
                            .receipt-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px; padding: 8px 0; border-bottom: 1px dashed #ccc; }
                            .receipt-info .left span, .receipt-info .right span { display: inline-block; min-width: 80px; color: #666; }
                            .receipt-info .left .val, .receipt-info .right .val { color: #333; font-weight: 500; }
                            .receipt-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
                            .receipt-table th { background: #f5f5f5; padding: 6px 8px; border: 1px solid #ddd; text-align: center; font-weight: 600; }
                            .receipt-table td { padding: 6px 8px; border: 1px solid #ddd; text-align: center; }
                            .receipt-table .text-left { text-align: left; }
                            .receipt-total { text-align: right; font-size: 16px; padding: 8px 0; border-top: 2px solid #333; margin-top: 4px; }
                            .receipt-total .amount { font-size: 20px; font-weight: 700; color: #d32f2f; }
                            .receipt-footer { display: flex; justify-content: space-between; font-size: 13px; margin-top: 18px; padding-top: 10px; border-top: 1px solid #ddd; }
                            .receipt-footer .sign { min-width: 120px; text-align: center; }
                            .receipt-footer .sign .line { display: inline-block; width: 100px; border-bottom: 1px solid #333; margin-top: 4px; }
                            .receipt-remark { font-size: 12px; color: #999; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; }
                            @media print {
                                body { background: #fff; padding: 0; }
                                .receipt-box { box-shadow: none; padding: 10mm 15mm; }
                                .no-print { display: none !important; }
                            }
                        </style>
                    </head>
                    <body>
                        ${printContent.innerHTML}
                        <div style="text-align:center;padding:12px 0;font-size:12px;color:#999;" class="no-print">
                            <button onclick="window.print()" style="padding:8px 24px;margin:0 8px;border:none;border-radius:4px;background:#2d6a9f;color:#fff;cursor:pointer;font-size:14px;">
                                <i class="fas fa-print"></i> 打印
                            </button>
                            <button onclick="window.close()" style="padding:8px 24px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:14px;">关闭</button>
                        </div>
                    </body>
                    </html>
                `;

                printWindow.document.write(html);
                printWindow.document.close();

            }).catch(function(err) {
                paymentTable.layer.closeAll('loading');
                paymentTable.layer.msg('加载数据失败: ' + err, {icon: 5});
            });
        }

        // ============================================================
        //  填充打印数据
        // ============================================================
        function fillReceiptData(payment, receivable) {
            // 基本信息
            document.getElementById('printNo').textContent = payment.PaymentNo || '-';
            document.getElementById('printDate').textContent = payment.PaymentDate || '-';
            document.getElementById('printContract').textContent = payment.ContractNo || '-';
            document.getElementById('printCounter').textContent = payment.CounterName || receivable.CounterName || '-';
            document.getElementById('printReceiver').textContent = payment.ReceivedBy || '';

            // 费用明细
            var rent = parseFloat(receivable.RentAmount) || 0;
            var water = parseFloat(receivable.WaterAmount) || 0;
            var electric = parseFloat(receivable.ElectricAmount) || 0;
            var other = parseFloat(receivable.OtherFee) || 0;
            var total = parseFloat(payment.PaymentAmount) || 0;

            document.getElementById('printRent').textContent = rent.toFixed(2);
            document.getElementById('printWater').textContent = water.toFixed(2);
            document.getElementById('printElectric').textContent = electric.toFixed(2);
            document.getElementById('printOther').textContent = other.toFixed(2);
            document.getElementById('printTotal').textContent = '¥' + total.toFixed(2);

            // 大写金额
            document.getElementById('printTotalCN').textContent = numToChinese(total);

            // 备注
            document.getElementById('printRemark').textContent = payment.Remarks || receivable.Remarks || '';
            document.getElementById('printTime').textContent = new Date().toLocaleString();
        }

 // ============================================================
//  数字转中文大写（修复版 - 无递归）
// ============================================================
function numToChinese(num) {
    if (num === 0 || num === undefined || num === null) {
        return '零元整';
    }
    
    var digits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
    var units = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿'];
    
    var numStr = num.toFixed(2);
    var parts = numStr.split('.');
    var intPart = parts[0];
    var decPart = parts[1];
    
    function convertInt(str) {
        if (str === '0') return '';
        var len = str.length;
        var result = '';
        var zero = false;
        
        for (var i = 0; i < len; i++) {
            var digit = parseInt(str[i]);
            var pos = len - i - 1;
            
            if (digit === 0) {
                zero = true;
                continue;
            }
            if (zero) {
                result += '零';
                zero = false;
            }
            result += digits[digit] + units[pos];
        }
        return result;
    }
    
    function convertDec(str) {
        var jiao = parseInt(str[0]) || 0;
        var fen = parseInt(str[1]) || 0;
        var result = '';
        
        if (jiao > 0) {
            result += digits[jiao] + '角';
        }
        if (fen > 0) {
            result += digits[fen] + '分';
        }
        return result;
    }
    
    var intResult = convertInt(intPart);
    var decResult = convertDec(decPart);
    
    if (intResult && decResult) {
        return intResult + '元' + decResult;
    } else if (intResult) {
        return intResult + '元整';
    } else if (decResult) {
        return decResult;
    } else {
        return '零元整';
    }
}

        // 注册打印方法
        paymentTable.printReceipt = printReceipt;
    </script>
</body>
</html>
