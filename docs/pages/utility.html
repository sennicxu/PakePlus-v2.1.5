<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>水电费录入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .utility-status-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .utility-status-tag .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .utility-status-tag.pending {
            background: #f0f0f0;
            color: #999;
        }
        .utility-status-tag.pending .dot {
            background: #999;
        }
        .utility-status-tag.entered {
            background: #e8f0fe;
            color: #2d6a9f;
        }
        .utility-status-tag.entered .dot {
            background: #2d6a9f;
        }
        .utility-status-tag.confirmed {
            background: #e6f7e6;
            color: #52c41a;
        }
        .utility-status-tag.confirmed .dot {
            background: #52c41a;
        }

        .contract-info-box {
            background: #f7f9fc;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
        }
        .contract-info-box .item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .contract-info-box .item .label {
            color: #999;
        }
        .contract-info-box .item .value {
            font-weight: 500;
            color: #333;
        }

        .reading-group {
            background: #f7f9fc;
            border-radius: 6px;
            padding: 12px 14px;
            margin: 6px 0 10px 0;
        }
        .reading-group .group-title {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .reading-group .group-title.water { color: #2d6a9f; }
        .reading-group .group-title.electric { color: #faad14; }

        .modal-form .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 20px;
        }
        .modal-form .form-group {
            margin-bottom: 10px;
        }
        .modal-form .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            margin-bottom: 3px;
        }
        .modal-form .form-group input,
        .modal-form .form-group select,
        .modal-form .form-group textarea {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #e0e4ea;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
            transition: all 0.3s;
        }
        .modal-form .form-group input:focus,
        .modal-form .form-group select:focus,
        .modal-form .form-group textarea:focus {
            border-color: #2d6a9f;
            box-shadow: 0 0 0 3px rgba(45,106,159,0.08);
        }
        .modal-form .form-group input[readonly] {
            background: #f0f2f5;
            color: #1a3a5c;
            font-weight: 600;
        }

        .auto-calc-hint {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .modal-form .form-row-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="tableWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/table.js"></script>
    <script>
        var utilityTable = new DataTable({
            container: '#tableWrap',
            title: '水电费录入',
            subtitle: '按月录入水电表读数，自动计算费用',
            icon: '💧',
            badge: '共 0 条',

            api: UtilityAPI,

            // 开启导入导出
            importable: true,
            exportable: true,

            searchFields: [
                { value: 'contract_no', label: '合同编号' },
                { value: 'counter_name', label: '专柜名称' }
            ],

            advancedFields: [
                { value: 'contract_no', label: '合同编号' },
                { value: 'counter_name', label: '专柜名称' },
                { value: 'bill_year', label: '年份' },
                { value: 'bill_month', label: '月份' },
                { value: 'status', label: '状态' }
            ],

            stats: [
                { id: 'statTotal', label: '记录总数', icon: '📊', calc: function(row) { return 1; } },
                { id: 'statPending', label: '待录入', icon: '⏳', color: 'gray', calc: function(row) { return row.Status === 0 ? 1 : 0; } },
                { id: 'statEntered', label: '已录入', icon: '📝', color: 'blue', calc: function(row) { return row.Status === 1 ? 1 : 0; } },
                { id: 'statConfirmed', label: '已确认', icon: '✅', color: 'green', calc: function(row) { return row.Status === 2 ? 1 : 0; } }
            ],

            columns: [
                { field: 'ContractNo', label: '合同编号', width: '130px' },
                { field: 'CounterName', label: '专柜名称', width: '130px' },
                { field: 'TenantName', label: '承租人', width: '80px' },
                { field: 'BillYear', label: '年份', width: '70px' },
                { 
                    field: 'BillMonth', 
                    label: '月份', 
                    width: '60px',
                    render: function(value) {
                        var monthNames = ['', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
                        return monthNames[value] || '-';
                    }
                },
                { 
                    field: 'PreviousWaterReading', 
                    label: '上月水表', 
                    width: '90px',
                    render: function(value) {
                        return value || '0';
                    }
                },
                { 
                    field: 'CurrentWaterReading', 
                    label: '本月水表', 
                    width: '90px',
                    render: function(value) {
                        return value || '0';
                    }
                },
                { 
                    field: 'WaterAmount', 
                    label: '水费(元)', 
                    width: '100px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span style="color:#2d6a9f;">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'PreviousElectricReading', 
                    label: '上月电表', 
                    width: '90px',
                    render: function(value) {
                        return value || '0';
                    }
                },
                { 
                    field: 'CurrentElectricReading', 
                    label: '本月电表', 
                    width: '90px',
                    render: function(value) {
                        return value || '0';
                    }
                },
                { 
                    field: 'ElectricAmount', 
                    label: '电费(元)', 
                    width: '100px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span style="color:#faad14;">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'Status', 
                    label: '状态', 
                    width: '90px',
                    render: function(value) {
                        var map = {
                            0: { text: '待录入', cls: 'pending' },
                            1: { text: '已录入', cls: 'entered' },
                            2: { text: '已确认', cls: 'confirmed' }
                        };
                        var info = map[value] || { text: '未知', cls: 'pending' };
                        return '<span class="utility-status-tag ' + info.cls + '"><span class="dot"></span>' + info.text + '</span>';
                    }
                },
                { field: 'CreateDate', label: '创建时间', width: '155px' }
            ],

            rowActions: [
                { label: '编辑', class: 'btn-edit', icon: 'fas fa-edit', handler: 'showEdit' },
                { 
                    label: '确认', 
                    class: 'btn-success', 
                    icon: 'fas fa-check', 
                    handler: 'confirmUtility',
                    disabled: function(row) {
                        return row.Status === 2;
                    }
                },
                { label: '删除', class: 'btn-delete', icon: 'fas fa-trash', handler: 'showDelete' }
            ],

            formFields: [
                { 
                    id: 'fContractId', 
                    field: 'contract_id', 
                    label: '合同', 
                    type: 'select', 
                    required: true, 
                    options: [],
                    placeholder: '请选择合同'
                },
                { 
                    id: 'fBillYear', 
                    field: 'bill_year', 
                    label: '年份', 
                    type: 'select', 
                    required: true,
                    options: (function() {
                        var opts = [];
                        var year = new Date().getFullYear();
                        for (var y = year - 2; y <= year + 1; y++) {
                            opts.push({ value: y, label: y + '年' });
                        }
                        return opts;
                    })()
                },
                { 
                    id: 'fBillMonth', 
                    field: 'bill_month', 
                    label: '月份', 
                    type: 'select', 
                    required: true,
                    options: (function() {
                        var opts = [];
                        for (var m = 1; m <= 12; m++) {
                            opts.push({ value: m, label: m + '月' });
                        }
                        return opts;
                    })()
                },
                { 
                    id: 'fStatus', 
                    field: 'status', 
                    label: '状态', 
                    type: 'select',
                    options: [
                        { value: 0, label: '待录入' },
                        { value: 1, label: '已录入' },
                        { value: 2, label: '已确认' }
                    ]
                },
                { id: 'fRemarks', field: 'remarks', label: '备注', type: 'textarea', placeholder: '请输入备注信息' }
            ]
        });

        // ============================================================
        //  加载合同选项
        // ============================================================
        function loadContractOptions() {
            var user = getCurrentUser();
            var params = {};
            if (user && user.Id) {
                params._user_id = user.Id;
            }
            ContractAPI.list(params).then(function(contracts) {
                var options = [];
                if (contracts && contracts.length > 0) {
                    contracts.forEach(function(c) {
                        options.push({
                            value: c.Id,
                            label: c.ContractNo + ' - ' + c.CounterName + ' (' + c.TenantName + ')'
                        });
                    });
                }
                utilityTable.config.formFields.forEach(function(field) {
                    if (field.id === 'fContractId') {
                        field.options = options;
                    }
                });
            }).catch(function(err) {
                console.error('加载合同列表失败:', err);
            });
        }

        setTimeout(function() {
            loadContractOptions();
        }, 300);

        // ============================================================
        //  获取上月水电费数据
        // ============================================================
        function getPreviousMonthData(contractId, year, month, callback) {
            var prevYear = year;
            var prevMonth = month - 1;
            if (prevMonth === 0) {
                prevMonth = 12;
                prevYear = year - 1;
            }
            
            UtilityAPI.list({
                contract_id: contractId,
                bill_year: prevYear,
                bill_month: prevMonth
            }).then(function(data) {
                if (data && data.length > 0) {
                    var record = data[0];
                    callback({
                        previous_water: record.CurrentWaterReading || 0,
                        previous_electric: record.CurrentElectricReading || 0,
                        water_unit_price: record.WaterUnitPrice || 0,
                        electric_unit_price: record.ElectricUnitPrice || 0
                    });
                } else {
                    callback(null);
                }
            }).catch(function() {
                callback(null);
            });
        }

        // ============================================================
        //  重写 buildFormHtml
        // ============================================================
        utilityTable.buildFormHtml = function(data, action) {
            var isEdit = action === 'edit';
            var html = '<div class="modal-form">';
            html += '<input type="hidden" id="editId" value="' + (isEdit ? (data.Id || '') : '') + '">';

            if (isEdit && data) {
                html += `
                    <div class="contract-info-box">
                        <span class="item"><span class="label">合同：</span><span class="value">${data.ContractNo || '-'}</span></span>
                        <span class="item"><span class="label">专柜：</span><span class="value">${data.CounterName || '-'}</span></span>
                        <span class="item"><span class="label">承租人：</span><span class="value">${data.TenantName || '-'}</span></span>
                        <span class="item"><span class="label">月份：</span><span class="value">${data.BillYear || ''}年${data.BillMonth || ''}月</span></span>
                    </div>
                `;
            }

            html += '<div class="form-row-2">';
            html += buildFieldHtml('fContractId', data, isEdit);
            html += buildFieldHtml('fBillYear', data, isEdit);
            html += '</div>';
            html += '<div class="form-row-2">';
            html += buildFieldHtml('fBillMonth', data, isEdit);
            html += '</div>';

            // 水表读数
            html += '<div class="reading-group">';
            html += '<div class="group-title water"><i class="fas fa-tint"></i> 水表读数</div>';
            html += '<div class="form-row-2">';
            html += buildReadingField('fPreviousWater', '上月水表读数', data, isEdit);
            html += buildReadingField('fCurrentWater', '本月水表读数', data, isEdit);
            html += '</div>';
            html += '<div class="form-row-2">';
            html += buildReadingField('fWaterUnitPrice', '水费单价(元/吨)', data, isEdit);
            html += buildReadonlyField('fWaterAmount', '水费金额(元)', data, isEdit, 'water');
            html += '</div>';
            html += '</div>';

            // 电表读数
            html += '<div class="reading-group">';
            html += '<div class="group-title electric"><i class="fas fa-bolt"></i> 电表读数</div>';
            html += '<div class="form-row-2">';
            html += buildReadingField('fPreviousElectric', '上月电表读数', data, isEdit);
            html += buildReadingField('fCurrentElectric', '本月电表读数', data, isEdit);
            html += '</div>';
            html += '<div class="form-row-2">';
            html += buildReadingField('fElectricUnitPrice', '电费单价(元/度)', data, isEdit);
            html += buildReadonlyField('fElectricAmount', '电费金额(元)', data, isEdit, 'electric');
            html += '</div>';
            html += '</div>';

            html += '<div class="form-row-2">';
            html += buildFieldHtml('fStatus', data, isEdit);
            html += '</div>';
            html += buildFieldHtml('fRemarks', data, isEdit);

            html += '<div class="form-footer">';
            html += '<button class="btn btn-default" onclick="window._table.closeModal()">取消</button>';
            html += '<button class="btn btn-primary" onclick="window._table.submitForm()"><i class="fas fa-save"></i> ' + (isEdit ? '保存' : '添加') + '</button>';
            html += '</div></div>';
            return html;

            function buildFieldHtml(fieldId, data, isEdit) {
                var field = null;
                utilityTable.config.formFields.forEach(function(f) {
                    if (f.id === fieldId) field = f;
                });
                if (!field) return '';

                var value = isEdit ? utilityTable.getFieldValue(data, field.field) : '';
                if (value === undefined || value === null) value = '';
                var required = field.required ? '<span class="required">*</span> ' : '';
                var inputHtml = '';

                if (field.type === 'select') {
                    var options = '';
                    if (field.options && field.options.length > 0) {
                        field.options.forEach(function(opt) {
                            var selected = (value == opt.value) ? 'selected' : '';
                            options += '<option value="' + opt.value + '" ' + selected + '>' + opt.label + '</option>';
                        });
                    }
                    inputHtml = '<select id="' + field.id + '">' + options + '</select>';
                } else if (field.type === 'textarea') {
                    inputHtml = '<textarea id="' + field.id + '" placeholder="' + (field.placeholder || '') + '">' + (value || '') + '</textarea>';
                } else {
                    inputHtml = '<input type="' + (field.type || 'text') + '" id="' + field.id + '" value="' + (value || '') + '" placeholder="' + (field.placeholder || '') + '">';
                }

                return '<div class="form-group">' +
                    '<label>' + required + field.label + '</label>' +
                    inputHtml +
                    (field.help ? '<div class="help-text">' + field.help + '</div>' : '') +
                    '</div>';
            }

            function buildReadingField(fieldId, label, data, isEdit) {
                var fieldMap = {
                    'fPreviousWater': 'previous_water_reading',
                    'fCurrentWater': 'current_water_reading',
                    'fWaterUnitPrice': 'water_unit_price',
                    'fPreviousElectric': 'previous_electric_reading',
                    'fCurrentElectric': 'current_electric_reading',
                    'fElectricUnitPrice': 'electric_unit_price'
                };
                var field = fieldMap[fieldId] || fieldId;
                var value = isEdit ? utilityTable.getFieldValue(data, field) : '';
                if (value === undefined || value === null) value = '';
                
                var inputId = fieldId;
                var inputHtml = '<input type="number" step="0.01" id="' + inputId + '" value="' + (value || '') + '" placeholder="请输入" oninput="window._table.calcUtilityAmount()">';
                
                if (fieldId === 'fPreviousWater' || fieldId === 'fPreviousElectric') {
                    inputHtml += '<div class="auto-calc-hint"><i class="fas fa-magic"></i> 自动读取上月数据</div>';
                }
                
                return '<div class="form-group">' +
                    '<label>' + label + '</label>' +
                    inputHtml +
                    '</div>';
            }

            function buildReadonlyField(fieldId, label, data, isEdit, type) {
                var fieldMap = {
                    'fWaterAmount': 'water_amount',
                    'fElectricAmount': 'electric_amount'
                };
                var field = fieldMap[fieldId] || fieldId;
                var value = isEdit ? utilityTable.getFieldValue(data, field) : 0;
                if (value === undefined || value === null) value = 0;
                var val = parseFloat(value) || 0;
                
                return '<div class="form-group">' +
                    '<label>' + label + '</label>' +
                    '<input type="text" id="' + fieldId + '" value="¥' + val.toFixed(2) + '" readonly style="background:#f0f2f5;color:' + (type === 'water' ? '#2d6a9f' : '#faad14') + ';font-weight:600;font-size:15px;">' +
                    '</div>';
            }
        };

        // ============================================================
        //  自动计算水电费
        // ============================================================
        utilityTable.calcUtilityAmount = function() {
            var prevWater = parseFloat(document.getElementById('fPreviousWater').value) || 0;
            var currWater = parseFloat(document.getElementById('fCurrentWater').value) || 0;
            var waterPrice = parseFloat(document.getElementById('fWaterUnitPrice').value) || 0;
            
            var prevElectric = parseFloat(document.getElementById('fPreviousElectric').value) || 0;
            var currElectric = parseFloat(document.getElementById('fCurrentElectric').value) || 0;
            var electricPrice = parseFloat(document.getElementById('fElectricUnitPrice').value) || 0;
            
            var waterAmount = (currWater - prevWater) * waterPrice;
            if (waterAmount < 0) waterAmount = 0;
            var waterEl = document.getElementById('fWaterAmount');
            if (waterEl) waterEl.value = '¥' + waterAmount.toFixed(2);
            
            var electricAmount = (currElectric - prevElectric) * electricPrice;
            if (electricAmount < 0) electricAmount = 0;
            var electricEl = document.getElementById('fElectricAmount');
            if (electricEl) electricEl.value = '¥' + electricAmount.toFixed(2);
            
            window._waterAmount = waterAmount;
            window._electricAmount = electricAmount;
        };

        // ============================================================
        //  重写 showEdit
        // ============================================================
        utilityTable.showEdit = function(id) {
            if (!utilityTable.layer) {
                alert('LayUI 未加载');
                return;
            }
            utilityTable.layer.load(1);
            UtilityAPI.get(id).then(function(data) {
                utilityTable.layer.closeAll('loading');
                if (!data) {
                    utilityTable.layer.msg('数据不存在', {icon: 5});
                    return;
                }
                if (!data.Id) data.Id = id;
                var html = utilityTable.buildFormHtml(data, 'edit');
                utilityTable.openModal('<i class="fas fa-edit"></i> 编辑水电费', html);
                setTimeout(function() {
                    utilityTable.calcUtilityAmount();
                }, 200);
            }).catch(function(err) {
                utilityTable.layer.closeAll('loading');
                utilityTable.layer.msg('获取数据失败: ' + err, {icon: 5});
            });
        };

        // ============================================================
        //  重写 showAdd
        // ============================================================
        utilityTable.showAdd = function() {
            loadContractOptions();
            var html = utilityTable.buildFormHtml({}, 'add');
            utilityTable.openModal('<i class="fas fa-plus"></i> 录入水电费', html);
            setTimeout(function() {
                var inputs = ['fPreviousWater', 'fCurrentWater', 'fWaterUnitPrice', 
                              'fPreviousElectric', 'fCurrentElectric', 'fElectricUnitPrice'];
                inputs.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) {
                        el.addEventListener('input', function() {
                            utilityTable.calcUtilityAmount();
                        });
                    }
                });
                
                var contractEl = document.getElementById('fContractId');
                var yearEl = document.getElementById('fBillYear');
                var monthEl = document.getElementById('fBillMonth');
                
                function autoFillPrevious() {
                    var contractId = contractEl ? contractEl.value : '';
                    var year = yearEl ? parseInt(yearEl.value) : 0;
                    var month = monthEl ? parseInt(monthEl.value) : 0;
                    
                    if (contractId && year && month) {
                        getPreviousMonthData(contractId, year, month, function(data) {
                            if (data) {
                                var prevWaterEl = document.getElementById('fPreviousWater');
                                var prevElectricEl = document.getElementById('fPreviousElectric');
                                var waterPriceEl = document.getElementById('fWaterUnitPrice');
                                var electricPriceEl = document.getElementById('fElectricUnitPrice');
                                
                                if (prevWaterEl && !prevWaterEl.value) {
                                    prevWaterEl.value = data.previous_water || 0;
                                }
                                if (prevElectricEl && !prevElectricEl.value) {
                                    prevElectricEl.value = data.previous_electric || 0;
                                }
                                if (waterPriceEl && !waterPriceEl.value && data.water_unit_price) {
                                    waterPriceEl.value = data.water_unit_price;
                                }
                                if (electricPriceEl && !electricPriceEl.value && data.electric_unit_price) {
                                    electricPriceEl.value = data.electric_unit_price;
                                }
                                utilityTable.calcUtilityAmount();
                            }
                        });
                    }
                }
                
                if (contractEl) contractEl.addEventListener('change', autoFillPrevious);
                if (yearEl) yearEl.addEventListener('change', autoFillPrevious);
                if (monthEl) monthEl.addEventListener('change', autoFillPrevious);
                
                utilityTable.calcUtilityAmount();
            }, 300);
        };

        // ============================================================
        //  重写 submitForm
        // ============================================================
        utilityTable.submitForm = function() {
            utilityTable.calcUtilityAmount();
            
            var id = document.getElementById('editId').value;
            var contractId = document.getElementById('fContractId').value;
            var billYear = document.getElementById('fBillYear').value;
            var billMonth = document.getElementById('fBillMonth').value;
            var previousWater = parseFloat(document.getElementById('fPreviousWater').value) || 0;
            var currentWater = parseFloat(document.getElementById('fCurrentWater').value) || 0;
            var waterUnitPrice = parseFloat(document.getElementById('fWaterUnitPrice').value) || 0;
            var previousElectric = parseFloat(document.getElementById('fPreviousElectric').value) || 0;
            var currentElectric = parseFloat(document.getElementById('fCurrentElectric').value) || 0;
            var electricUnitPrice = parseFloat(document.getElementById('fElectricUnitPrice').value) || 0;
            var status = parseInt(document.getElementById('fStatus').value) || 0;
            var remarks = document.getElementById('fRemarks').value.trim();

            var waterAmount = (currentWater - previousWater) * waterUnitPrice;
            if (waterAmount < 0) waterAmount = 0;
            var electricAmount = (currentElectric - previousElectric) * electricUnitPrice;
            if (electricAmount < 0) electricAmount = 0;

            if (!contractId) {
                utilityTable.layer.msg('请选择合同', {icon: 5});
                return;
            }
            if (!billYear) {
                utilityTable.layer.msg('请选择年份', {icon: 5});
                return;
            }
            if (!billMonth) {
                utilityTable.layer.msg('请选择月份', {icon: 5});
                return;
            }

            var data = {
                contract_id: parseInt(contractId),
                bill_year: parseInt(billYear),
                bill_month: parseInt(billMonth),
                previous_water_reading: previousWater,
                current_water_reading: currentWater,
                water_unit_price: waterUnitPrice,
                water_amount: waterAmount,
                previous_electric_reading: previousElectric,
                current_electric_reading: currentElectric,
                electric_unit_price: electricUnitPrice,
                electric_amount: electricAmount,
                status: status,
                remarks: remarks
            };

            if (!utilityTable.layer) return;
            utilityTable.layer.load(1);

            var promise = id ? UtilityAPI.update({id: parseInt(id), ...data}) : UtilityAPI.add(data);
            promise.then(function() {
                utilityTable.layer.closeAll('loading');
                utilityTable.layer.msg(id ? '更新成功' : '添加成功', {icon: 1});
                utilityTable.closeModal();
                utilityTable.loadData();
            }).catch(function(err) {
                utilityTable.layer.closeAll('loading');
                utilityTable.layer.msg('操作失败: ' + err, {icon: 5});
            });
        };

        // ============================================================
        //  确认水电费
        // ============================================================
        function confirmUtility(id) {
            if (!utilityTable.layer) return;

            utilityTable.layer.confirm(
                '<div style="text-align:center;padding:10px 0;">' +
                '<div style="font-size:36px;margin-bottom:10px;">✅</div>' +
                '<div style="font-size:16px;font-weight:500;">确认该水电费记录？</div>' +
                '<div style="color:#999;font-size:13px;margin-top:6px;">确认后将更新到应收账款，不可撤销</div>' +
                '</div>',
                { icon: 0, title: '确认操作' },
                function(index) {
                    UtilityAPI.get(id).then(function(data) {
                        if (!data) {
                            utilityTable.layer.msg('记录不存在', {icon: 5});
                            return;
                        }
                        return UtilityAPI.updateToReceivable({
                            contract_id: data.ContractId,
                            bill_year: data.BillYear,
                            bill_month: data.BillMonth
                        });
                    }).then(function() {
                        utilityTable.layer.closeAll('loading');
                        utilityTable.layer.msg('确认成功，已更新到应收账款', {icon: 1});
                        utilityTable.loadData();
                        utilityTable.layer.close(index);
                    }).catch(function(err) {
                        utilityTable.layer.closeAll('loading');
                        utilityTable.layer.msg('确认失败: ' + err, {icon: 5});
                    });
                }
            );
        }

        utilityTable.confirmUtility = confirmUtility;

        // ============================================================
        //  预加载合同数据
        // ============================================================
        var originalOnLoad = utilityTable.config.onLoad;
        utilityTable.config.onLoad = function(data) {
            loadContractOptions();
            if (originalOnLoad && typeof originalOnLoad === 'function') {
                originalOnLoad(data);
            }
        };
    </script>
</body>
</html>
