<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>欠款明细</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .arrears-amount {
            font-weight: 700;
        }
        .arrears-amount.danger {
            color: #ff4d4f;
        }
        .arrears-amount.warning {
            color: #faad14;
        }
        .arrears-amount.normal {
            color: #52c41a;
        }
        .arrears-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .arrears-badge.overdue {
            background: #ffeded;
            color: #ff4d4f;
        }
        .arrears-badge.normal {
            background: #e6f7e6;
            color: #52c41a;
        }
        .arrears-badge.warning {
            background: #fff7e6;
            color: #faad14;
        }
        .arrears-detail-toggle {
            cursor: pointer;
            color: #2d6a9f;
            font-size: 12px;
        }
        .arrears-detail-toggle:hover {
            text-decoration: underline;
        }
        .arrears-detail-row {
            display: none;
            background: #f7f9fc;
        }
        .arrears-detail-row.show {
            display: table-row;
        }
        .arrears-detail-row td {
            padding: 8px 16px !important;
        }
        .arrears-detail-row .detail-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            font-size: 13px;
        }
        .arrears-detail-row .detail-grid .item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: #fff;
            border-radius: 4px;
        }
        .arrears-detail-row .detail-grid .item .label {
            color: #999;
            font-size: 12px;
        }
        .arrears-detail-row .detail-grid .item .value {
            font-weight: 600;
            color: #333;
        }
        .arrears-detail-row .detail-grid .item .value.danger { color: #ff4d4f; }
        .arrears-detail-row .detail-grid .item .value.warning { color: #faad14; }
        .arrears-detail-row .detail-grid .item .value.green { color: #52c41a; }
        @media (max-width: 768px) {
            .arrears-detail-row .detail-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="tableWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/table.js"></script>
    <script>
        var arrearsTable = new DataTable({
            container: '#tableWrap',
            title: '欠款明细',
            subtitle: '查看所有欠款门店及欠款详情',
            icon: '⚠️',
            badge: '共 0 家欠款',

            api: ReportAPI,

            importable: false,
            exportable: true,

            searchFields: [
                { value: 'counter_name', label: '专柜名称' },
                { value: 'tenant_name', label: '承租人' }
            ],

            advancedFields: [
                { value: 'counter_name', label: '专柜名称' },
                { value: 'tenant_name', label: '承租人' },
                { value: 'store_name', label: '门店名称' }
            ],

            stats: [
                { id: 'statTotal', label: '欠款商户', icon: '🏪', calc: function(row) { return 1; } },
                { id: 'statArrearsTotal', label: '欠款总额', icon: '💰', color: 'red', calc: function(row) { return parseFloat(row.TotalArrears) || 0; } },
                { id: 'statOverdueMonths', label: '逾期超2个月', icon: '⚠️', color: 'orange', calc: function(row) { return row.OverdueMonths > 0 ? 1 : 0; } },
                { id: 'statOverdueAmount', label: '逾期金额', icon: '📊', color: 'red', calc: function(row) { return row.OverdueMonths > 0 ? (parseFloat(row.OverdueAmount) || 0) : 0; } }
            ],

            columns: [
                { field: 'StoreName', label: '所属门店', width: '120px' },
                { field: 'CounterCode', label: '专柜编号', width: '100px' },
                { field: 'CounterName', label: '专柜名称', width: '130px' },
                { field: 'TenantName', label: '承租人', width: '80px' },
                { 
                    field: 'ArrearsMonths', 
                    label: '欠款月数', 
                    width: '90px',
                    render: function(value) {
                        var cls = value >= 3 ? 'arrears-badge overdue' : (value >= 2 ? 'arrears-badge warning' : 'arrears-badge normal');
                        return '<span class="' + cls + '">' + (value || 0) + '个月</span>';
                    }
                },
                { 
                    field: 'ArrearsRent', 
                    label: '欠租金', 
                    width: '100px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="arrears-amount danger">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'ArrearsWater', 
                    label: '欠水费', 
                    width: '90px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="arrears-amount warning">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'ArrearsElectric', 
                    label: '欠电费', 
                    width: '90px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        return '<span class="arrears-amount warning">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'TotalArrears', 
                    label: '欠款合计', 
                    width: '110px',
                    render: function(value) {
                        var v = parseFloat(value) || 0;
                        var cls = v > 0 ? 'danger' : 'normal';
                        return '<span class="arrears-amount ' + cls + '">¥' + v.toFixed(2) + '</span>';
                    }
                },
                { 
                    field: 'OverdueMonths', 
                    label: '逾期月数', 
                    width: '90px',
                    render: function(value) {
                        var v = value || 0;
                        if (v === 0) return '<span class="arrears-badge normal">正常</span>';
                        if (v >= 2) return '<span class="arrears-badge overdue">' + v + '个月</span>';
                        return '<span class="arrears-badge warning">' + v + '个月</span>';
                    }
                }
            ],

            rowActions: [
                { 
                    label: '查看详情', 
                    class: 'btn-permission', 
                    icon: 'fas fa-eye', 
                    handler: 'toggleDetail'
                }
            ],

            formFields: []
        });

        // ============================================================
        //  展开/收起详情
        // ============================================================
        var detailStates = {};

        function toggleDetail(contractId) {
            var rows = document.querySelectorAll('.arrears-detail-row');
            var targetRow = document.querySelector('.arrears-detail-row[data-contract="' + contractId + '"]');
            
            // 如果详情行已存在，切换显示
            if (targetRow) {
                targetRow.classList.toggle('show');
                return;
            }

            // 获取该合同的欠款详情
            var rowData = null;
            arrearsTable.allData.forEach(function(row) {
                if (row.ContractId === contractId) {
                    rowData = row;
                }
            });

            if (!rowData) return;

            // 创建详情行
            var tbody = document.getElementById('tableBody');
            var tr = document.createElement('tr');
            tr.className = 'arrears-detail-row show';
            tr.dataset.contract = contractId;
            tr.innerHTML = `
                <td colspan="${arrearsTable.config.columns.length + 1}">
                    <div class="detail-grid">
                        <div class="item"><span class="label">合同编号：</span><span class="value">${rowData.ContractNo || '-'}</span></div>
                        <div class="item"><span class="label">联系人：</span><span class="value">${rowData.TenantPhone || '-'}</span></div>
                        <div class="item"><span class="label">首次欠款：</span><span class="value warning">${rowData.FirstArrearsMonth || '-'}</span></div>
                        <div class="item"><span class="label">最新欠款：</span><span class="value danger">${rowData.LatestArrearsMonth || '-'}</span></div>
                        <div class="item"><span class="label">逾期金额：</span><span class="value danger">¥${(parseFloat(rowData.OverdueAmount) || 0).toFixed(2)}</span></div>
                    </div>
                </td>
            `;

            // 找到当前行的位置，插入到后面
            var rows_ = tbody.querySelectorAll('tr:not(.arrears-detail-row)');
            var targetRowIndex = -1;
            for (var i = 0; i < rows_.length; i++) {
                if (rows_[i].querySelector('[onclick*="' + contractId + '"]')) {
                    targetRowIndex = i;
                    break;
                }
            }

            if (targetRowIndex >= 0) {
                var refRow = rows_[targetRowIndex];
                if (refRow.nextSibling) {
                    tbody.insertBefore(tr, refRow.nextSibling);
                } else {
                    tbody.appendChild(tr);
                }
            } else {
                tbody.appendChild(tr);
            }
        }

        arrearsTable.toggleDetail = toggleDetail;

        // ============================================================
        //  重写 loadData（使用 ReportAPI.arrearsSummary）
        // ============================================================
        var originalLoadData = arrearsTable.loadData;
        arrearsTable.loadData = function() {
            var params = {};
            var tab = document.querySelector('.search-tabs .tab.active');
            var tabName = tab ? tab.dataset.tab : 'quick';

            if (tabName === 'quick') {
                var field = document.getElementById('quickField');
                var value = document.getElementById('quickValue');
                if (field && value && value.value.trim()) {
                    params[field.value] = value.value.trim();
                }
            } else {
                var conditions = arrearsTable.buildConditions();
                if (conditions.length > 0) {
                    params.conditions = conditions;
                    var logic = document.getElementById('logicType');
                    if (logic) params.logic = logic.value;
                }
            }

            // 使用 ReportAPI.arrearsSummary
            ReportAPI.arrearsSummary(params).then(function(data) {
                arrearsTable.allData = data || [];
                arrearsTable.filteredData = arrearsTable.allData.slice();
                arrearsTable.totalPages = Math.ceil(arrearsTable.filteredData.length / arrearsTable.pageSize) || 1;
                if (arrearsTable.currentPage > arrearsTable.totalPages) arrearsTable.currentPage = arrearsTable.totalPages || 1;
                arrearsTable.renderStats();
                arrearsTable.renderTable();
                arrearsTable.renderPagination();
                arrearsTable.updateSearchIndicator();
                if (arrearsTable.config.onLoad && typeof arrearsTable.config.onLoad === 'function') {
                    arrearsTable.config.onLoad(arrearsTable.allData);
                }
            }).catch(function(err) {
                if (arrearsTable.layer) arrearsTable.layer.msg('加载失败: ' + err, {icon: 5});
                arrearsTable.allData = [];
                arrearsTable.filteredData = [];
                arrearsTable.renderStats();
                arrearsTable.renderTable();
                arrearsTable.renderPagination();
            });
        };

        // ============================================================
        //  重写 renderTable（添加展开详情功能）
        // ============================================================
        var originalRenderTable = arrearsTable.renderTable;
        arrearsTable.renderTable = function() {
            var tbody = document.getElementById('tableBody');
            if (!tbody) return;

            var start = (arrearsTable.currentPage - 1) * arrearsTable.pageSize;
            var end = Math.min(start + arrearsTable.pageSize, arrearsTable.filteredData.length);
            var pageData = arrearsTable.filteredData.slice(start, end);

            var totalEl = document.getElementById('totalCount');
            var total2El = document.getElementById('totalCount2');
            var pageEl = document.getElementById('currentPageDisplay');
            if (totalEl) totalEl.textContent = arrearsTable.filteredData.length;
            if (total2El) total2El.textContent = arrearsTable.filteredData.length;
            if (pageEl) pageEl.textContent = arrearsTable.currentPage;

            if (pageData.length === 0) {
                var colCount = arrearsTable.config.columns.length + 1;
                tbody.innerHTML = '<tr><td colspan="' + colCount + '"><div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">' +
                    (arrearsTable.allData.length === 0 ? '暂无欠款，所有商户已结清！' : '没有匹配的数据') + '</div></div></td></tr>';
                return;
            }

            var html = '';
            var base = (arrearsTable.currentPage - 1) * arrearsTable.pageSize;
            for (var i = 0; i < pageData.length; i++) {
                var row = pageData[i];
                var idx = base + i + 1;
                html += '<tr>';
                html += '<td style="color:#bbb;font-weight:500;">' + idx + '</td>';

                arrearsTable.config.columns.forEach(function(col) {
                    var value = arrearsTable.getFieldValue(row, col.field);
                    if (col.render && typeof col.render === 'function') {
                        value = col.render(value, row);
                    } else if (col.format && typeof col.format === 'function') {
                        value = col.format(value, row);
                    }
                    if (value === undefined || value === null) value = '-';
                    html += '<td' + (col.tdClass ? ' class="' + col.tdClass + '"' : '') + '>' + value + '</td>';
                });

                html += '<td><div class="action-btns">';
                arrearsTable.config.rowActions.forEach(function(action) {
                    html += '<button class="btn-sm ' + action.class + '" onclick="window._table.' + action.handler + '(' + row.ContractId + ')">' +
                        (action.icon ? '<i class="' + action.icon + '"></i> ' : '') + action.label + '</button>';
                });
                html += '</div></td></tr>';

                // 如果详情行已展开，保留
                if (detailStates[row.ContractId]) {
                    html += '<tr class="arrears-detail-row show" data-contract="' + row.ContractId + '">';
                    html += '<td colspan="' + (arrearsTable.config.columns.length + 1) + '">';
                    html += '<div class="detail-grid">';
                    html += '<div class="item"><span class="label">合同编号：</span><span class="value">' + (row.ContractNo || '-') + '</span></div>';
                    html += '<div class="item"><span class="label">联系人：</span><span class="value">' + (row.TenantPhone || '-') + '</span></div>';
                    html += '<div class="item"><span class="label">首次欠款：</span><span class="value warning">' + (row.FirstArrearsMonth || '-') + '</span></div>';
                    html += '<div class="item"><span class="label">最新欠款：</span><span class="value danger">' + (row.LatestArrearsMonth || '-') + '</span></div>';
                    html += '<div class="item"><span class="label">逾期金额：</span><span class="value danger">¥' + (parseFloat(row.OverdueAmount) || 0).toFixed(2) + '</span></div>';
                    html += '</div></td></tr>';
                }
            }
            tbody.innerHTML = html;
        };
    </script>
</body>
</html>
